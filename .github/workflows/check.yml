name: check
on:
  pull_request:
  push:
    branches-ignore: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # テストで Node の SQLite（node:sqlite）を使う
          cache: npm
      - run: npm ci
      - run: npm run check
