<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#F3F5F2" />
  <meta name="description" content="商品のバーコードを読むと、その縞をまとったキャラが生まれます。" />
  <title>バーコードの子（試作）</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet" />
</head>
<body data-view="scan" data-chrome="tabs">
  <header class="top">
    <a class="mark" href="#/">バーコードの子</a>
    <span class="ver">試作</span>
  </header>

  <!-- 各画面は src/ui/views/ がここに描く -->
  <main id="app"></main>

  <nav class="tabs" aria-label="メニュー">
    <a href="#/" data-tab="scan">読む</a>
    <a href="#/shelf" data-tab="shelf">棚</a>
    <a href="#/battle" data-tab="battle">バトル<span class="tab-news" aria-label="お知らせあり"></span></a>
  </nav>

  <dialog id="share" class="sheet">
    <img id="share-img" alt="キャラの画像" />
    <p>長押し（パソコンは右クリック）で保存できます。</p>
    <button type="button" id="share-close" class="btn">閉じる</button>
  </dialog>

  <script type="module" src="/src/main.ts"></script>

</html>
